<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Board</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/help.css" />
    <link rel="stylesheet" href="../css/board.css" />
    <link rel="stylesheet" href="../css/addTask1.css" />
    <link rel="stylesheet" href="../css/addTask2.css" />
    <script src="../script.js" type="module"></script>
    <script src="../js/template_board.js"></script>
    <script src="../js/board/addtask-board.js" type="module"></script>
    <script src="../js/board/edittask-board.js" type="module"></script>
  </head>
  <body onload="init()">
    <main>
      <div id="main-container">
        <section id="board-header">
          <div id="board-title-container">
            <h1 id="board-title">Board</h1>
          </div>
          <div id="board-task-container">
            <div id="search-task-container">
              <input type="text" name="search-task" id="search-task" placeholder="Find Task" onkeyup="searchCards()"/>
              <button id="button-search" onclick="searchCards()">
                <img src="../assets/icons/search-btn.svg" alt="button-search" />
              </button>
            </div>
            <div id="add-task-btn-container">
              <button id="add-task-btn" onclick="showAddTaskModule('todo')">
                Add task
                <img src="../assets/icons/add-btn.svg" alt="add task button" />
              </button>
            </div>
          </div>
        </section>
        <section id="board-content">
          <section id="to-do-section">
            <div id="to-do-title-card" class="tasks-style">
              <h3 id="to-do-title">To do</h3>
              <button id="add-to-do-btn" onclick="showAddTaskModule('todo')">
                <img src="../assets/icons/button-add-task.svg" alt="button-add-task"/>
              </button>
            </div>
            <div id="to-do-cards-container" class="cards-container container" data-status="todo">
            </div>
          </section>
          <section id="in-progress-section">
            <div id="in-progress-card" class="tasks-style">
              <h3 id="in-progress-title">In progress</h3>
              <button id="add-in-progress-btn" onclick="showAddTaskModule('in-progress')">
                <img src="../assets/icons/button-add-task.svg" alt="button-add-task"/>
              </button>
            </div>
            <div id="in-progress-cards-container" class="cards-container container" data-status="inprogress">
            </div>
          </section>
          <section id="await-feedback-section">
            <div id="await-feedback-card" class="tasks-style">
              <h3 id="await-feedback-title">Await feedback</h3>
              <button id="add-await-feedback-btn" class="add-btn-tasks" onclick="showAddTaskModule('await-feedback')">
                <img src="../assets/icons/button-add-task.svg" alt="button-add-task"/>
              </button>
            </div>
            <div id="await-feedback-cards-container" class="cards-container container" data-status="awaitfeedback">
            </div>
          </section>
          <section id="done-section">
            <div id="done-card" class="tasks-style">
              <h3 id="done-title">Done</h3>
            </div>
            <div id="done-cards-container" class="cards-container container" data-status="done">
            </div>
          </section>
        </section>
      </div>
      <div id="help-container">
        <dialog id="myDialog"></dialog>
         <dialog id="myAddTask"></dialog>
      </div>
    </main>
    <div id="add-task-container"></div>
    <div id="congrats-modal" class="modal">
      <p>task added to board</p>
      <img src="../assets/icons/board.png" alt="" />
    </div>
    <script src="../js/board.js"></script>
  </body>
</html>
