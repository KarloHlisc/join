<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Summary</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/help.css" />
    <link rel="stylesheet" href="../css/summary.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/responsiveMobile.css" />
    <script src="../script.js" type="module"></script>
  </head>
  <body onload="init()">
    <aside class="side-bar-wrapper">
      <div class="aside-logo">
        <img src="../assets/img/join_white.svg" alt="Logo" />
      </div>
      <div class="aside-menu">
        <button id="nav-summary" onclick="location.href = './summary.html'">
          <img src="../assets/icons/summary.png" alt="" /> Summary
        </button>
        <button id="nav-add_task" onclick="location.href = './add_task.html'">
          <img src="../assets/icons/add_task.png" alt="" /> Add Task
        </button>
        <button id="nav-board" onclick="location.href = './board.html'">
          <img src="../assets/icons/board.png" alt="" /> Board
        </button>
        <button id="nav-contacts" onclick="location.href = './contacts.html'">
          <img src="../assets/icons/contacts.png" alt="" /> Contacts
        </button>
      </div>
      <div id="mobile-footer" class="aside-footer">
        <button
          class="nav-policy-btn"
          onclick="location.href = './policy_after_login.html'"
        >
          Privacy Policy
        </button>
        <button
          class="nav-legal-btn"
          onclick="location.href = './legal_after_login.html'"
        >
          Legal notice
        </button>
      </div>
    </aside>
    <header>
      <p>Kanban Project Management Tool</p>
      <div class="user-and-help">
        <button class="help-btn help" onclick="location.href = './help.html'">
          <img src="../assets/icons/help.png" alt="help-icon" />
        </button>
        <div class="user-icon-wrapper">
          <button
            class="user-icon"
            id="header-icon"
            onclick="showLogoutModule()"
          ></button>
          <div id="logout-container"></div>
        </div>
      </div>
    </header>
    <main>
      <div id="main-container">
        <div id="summary-container">
          <div id="details-header">
            <h1>Join 360</h1>
            <span>Key Metrics at a Glance</span>
          </div>
          <div class="container">
            <div class="header">
              <div class="cards-grid">
                <button
                  id="to-do-card-btn"
                  role="button"
                  class="card"
                  onclick="location.href = '../html/board.html'"
                >
                  <div class="card-icon todo">
                    <img
                      src="../assets/icons/to-do-edit.svg"
                      id="img-to-do"
                      class="img"
                      alt="edit-icon"
                    />
                  </div>
                  <div class="card-content">
                    <div id="card-number-to-do" class="card-number">0</div>
                    <div class="card-label">To-do</div>
                  </div>
                </button>
                <button
                  id="done-card-btn"
                  role="button"
                  class="card"
                  onclick="location.href = '../html/board.html'"
                >
                  <div class="card-icon done">
                    <img
                      src="../assets/icons/done-edit.svg"
                      id="img-done"
                      alt="icon done"
                    />
                  </div>
                  <div class="card-content">
                    <div id="card-number-done" class="card-number">0</div>
                    <div class="card-label">Done</div>
                  </div>
                </button>
              </div>
              <div>
                <button
                  role="button"
                  class="card-stats-level"
                  onclick="location.href = '../html/board.html'"
                >
                  <div class="card-icon urgent">
                    <img
                      src="../assets/icons/urgent-red.svg"
                      id="img-urgent"
                      alt="icon stat level"
                    />
                  </div>
                  <div class="card-content" id="card-content-urgent">
                    <div id="card-number-stat" class="card-number">0</div>
                    <div class="card-label">Urgent</div>
                  </div>
                  <div
                    class="card-content-line"
                    id="card-content-urgent-line"
                  ></div>
                  <div class="card-content">
                    <div id="card-deadline" class="card-deadline"></div>
                    <div class="card-deadline-date">Upcoming Deadline</div>
                  </div>
                </button>
              </div>
              <div class="stats-row">
                <button
                  role="button"
                  class="stat-card"
                  onclick="location.href = '../html/board.html'"
                >
                  <div id="tasks-in-board" class="stat-number">0</div>
                  <div class="stat-label">Tasks in Board</div>
                </button>
                <button
                  role="button"
                  class="stat-card"
                  onclick="location.href = '../html/board.html'"
                >
                  <div id="tasks-in-progress" class="stat-number">0</div>
                  <div class="stat-label">Tasks in Progress</div>
                </button>
                <button
                  role="button"
                  class="stat-card"
                  onclick="location.href = '../html/board.html'"
                >
                  <div id="awaiting-feedback" class="stat-number">0</div>
                  <div class="stat-label">Awaiting Feedback</div>
                </button>
              </div>
            </div>
            <div class="greeting-section">
              <p class="greeting-text" id="greeting-text"></p>
              <h2 class="greeting-name" id="greeting-name"></h2>
            </div>
          </div>
        </div>
      </div>
      <div id="help-container"></div>
    </main>
    <script src="../js/summary.js"></script>
  </body>
</html>
