<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Add task</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/icons/favicon.png"
      alt="x-icon"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/help.css" />
    <link rel="stylesheet" href="../css/addTaskForm.css" />
    <link rel="stylesheet" href="../css/addTaskComponents.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/responsiveMobile.css" />
    <script src="../script.js" type="module"></script>
    <script src="../js/addTask.js" type="module"></script>
  </head>
  <body data-page="add-task">
    <aside class="side-bar-wrapper">
      <div class="aside-logo">
        <img src="../assets/img/join_white.svg" alt="Logo" />
      </div>
      <div class="aside-menu">
        <button id="nav-summary" onclick="location.href = './summary.html'">
          <img src="../assets/icons/summary.png" alt="" /> Summary
        </button>
        <button id="nav-addTask" onclick="location.href = './addTask.html'">
          <img src="../assets/icons/add_task.png" alt="" /> Add Task
        </button>
        <button id="nav-board" onclick="location.href = './board.html'">
          <img src="../assets/icons/board.png" alt="" /> Board
        </button>
        <button id="nav-contacts" onclick="location.href = './contacts.html'">
          <img src="../assets/icons/contacts.png" alt="" /> Contacts
        </button>
      </div>
      <div id="mobile-footer" class="aside-footer">
        <button
          class="nav-policy-btn"
          onclick="location.href = './policyAfterLogin.html'"
        >
          Privacy Policy
        </button>
        <button
          class="nav-legal-btn"
          onclick="location.href = './legalAfterLogin.html'"
        >
          Legal notice
        </button>
      </div>
    </aside>
    <header>
      <p>Kanban Project Management Tool</p>
      <div class="user-and-help">
        <button class="help-btn help" onclick="location.href = './help.html'">
          <img src="../assets/icons/help.png" alt="help-icon" />
        </button>
        <div class="user-icon-wrapper">
          <button
            class="user-icon"
            id="header-icon"
            onclick="showLogoutModule()"
          ></button>
          <div id="logout-container"></div>
        </div>
      </div>
    </header>
    <main>
      <div id="main-container">
        <div id="form-container">
          <div id="add-task-title"><h1>Add Task</h1></div>
          <form id="addTaskForm" novalidate>
            <div id="form-body">
              <div id="leftSide">
                <label for="formTitle"
                  >Title<span class="red-star">*</span></label
                >
                <input type="text" id="formTitle" placeholder="Enter a title" />
                <div id="errorTitle" style="color: red"></div>
                <label for="description">Description</label>
                <textarea
                  id="description"
                  placeholder="Enter a description"
                ></textarea>
                <label for="duedate"
                  >Due date<span class="red-star">*</span></label
                >
                <input type="date" id="duedate" placeholder="dd/mm/yy" />
                <div id="errorDate" style="color: red"></div>
              </div>
              <div id="rightSide">
                <span class="form-label">Priority</span>
                <div id="priority-buttons">
                  <button
                    type="button"
                    class="priority-btn"
                    id="urgent-btn"
                    data-value="urgent"
                  >
                    Urgent
                    <img
                      src="../assets/icons/urgent.svg"
                      alt=""
                      aria-hidden="true"
                    />
                  </button>
                  <button
                    type="button"
                    class="priority-btn"
                    id="medium-btn"
                    data-value="medium"
                  >
                    Medium
                    <img
                      src="../assets/icons/medium.svg"
                      alt=""
                      aria-hidden="true"
                    />
                  </button>
                  <button
                    type="button"
                    class="priority-btn"
                    id="low-btn"
                    data-value="low"
                  >
                    Low
                    <img
                      src="../assets/icons/low.svg"
                      alt=""
                      aria-hidden="true"
                    />
                  </button>
                </div>
                <label for="searchInput">Assigned to</label>
                <div class="custom-dropdown">
                  <div class="dropdown-header-input-wrapper">
                    <input
                      type="text"
                      id="searchInput"
                      placeholder="Select contacts to assign"
                      autocomplete="off"
                    />
                    <button
                      type="button"
                      id="dropdownToggle"
                      class="dropdown-btn"
                      aria-label="Show contact list"
                    >
                      <img
                        src="../assets/icons/arrow-drop-down.svg"
                        alt="Arrow down"
                        class="dropdown-img"
                        id="dropdownArrowImg"
                      />
                    </button>
                  </div>
                  <ul class="dropdown-list hidden" id="dropdownList"></ul>
                </div>
                <div id="assignedUsersContainer" class="assigned-users"></div>
                <ul class="assigned-users"></ul>
                <label for="categoryToggle"
                  >Category<span class="red-star">*</span></label
                >
                <div class="custom-dropdown">
                  <div class="dropdown-header" id="categoryHeader">
                    <span id="categorySelectedText">Select task category</span>
                    <button
                      type="button"
                      id="categoryToggle"
                      class="dropdown-btn"
                      aria-label="Show categories"
                    >
                      <img
                        src="../assets/icons/arrow-drop-down.svg"
                        alt="Arrow down"
                        class="dropdown-img"
                        id="categoryArrowImg"
                      />
                    </button>
                  </div>
                  <ul class="dropdown-list hidden" id="categoryList">
                    <li class="user-item" data-value="Technical Tasks">
                      <span>Technical Tasks</span>
                    </li>
                    <li class="user-item" data-value="User Story">
                      <span>User Story</span>
                    </li>
                  </ul>
                  <div id="errorCategory" style="color: red"></div>
                </div>
                <label for="subtaskInput">Subtasks</label>
                <div class="subtask-container">
                  <input
                    type="text"
                    id="subtaskInput"
                    placeholder="Add new Subtasks"
                  />
                  <button type="button" id="addSubtaskBtn">
                    <img
                      src="../assets/icons/darkcheck.svg"
                      alt="Add Subtask"
                    />
                  </button>
                  <button type="button" id="clearSubtaskBtn">
                    <img src="../assets/icons/delete.svg" alt="Clear input" />
                  </button>
                </div>
                <ul id="subTaskList"></ul>
              </div>
            </div>
            <div id="createTaskBtn-container">
              <span class="required-hint"
                ><span class="red-star">*</span>This field is required</span
              >
              <div id="btn-container">
                <button type="reset" id="clear">
                  Clear
                  <img
                    src="../assets/icons/vector.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </button>
                <button type="submit" id="createTask">
                  Create Task
                  <img
                    src="../assets/icons/check.svg"
                    alt=""
                    aria-hidden="true"
                  />
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div id="help-container"></div>
    </main>
    <div id="congrats-modal" class="modal">
      <p>task added to board</p>
      <img src="../assets/icons/board.png" />
    </div>
  </body>
</html>
