<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Board</title>
    <link rel="stylesheet" href="style.css">
    <style>
       
        #aside-bar, section{
                display: flex;
    flex-direction: column;
    min-height: 100dvh;
    width: 230px;
    background-color: var(--aside-bar-color);
  background:rgba(42, 54, 71, 1) ;
  color: white;
  }

  .aside-logo{
    display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding-top: 30px;
  }

  .aside-menu{
    display: flex;
  flex-direction: column;
  background: transparent;
  text-align: center;
  align-items: center;
  justify-content: center;
  border: none;
  flex: 1;
  }
 button{
  background: none;
  color: inherit;
  border: none;
  padding: 0;
  font: inherit;
  cursor: pointer;
  outline: inherit;
}
.aside-footer{
    display: flex;
    align-items: center;
    flex-direction: column;
    margin-bottom: 30px;
    gap: 10px;
}

    </style>
</head>
<body>
    <header></header>
    <section id="aside-bar" class="aside-bar">
        <div class="aside-logo">
            <img src="../assets/img/join_white.svg" alt="Join logo">
        </div>
        <div class="aside-menu">
          <div>  <button><img src="../assets/icons/summary.png" alt="join summary"> Summary</button></div>
          <div>  <button><img src="../assets/icons/add_task.png" alt="join add_task"> add Task</button></div>
          <div>  <button><img src="../assets/icons/board.png" alt="join board"> Board</button></div>
          <div>  <button><img src="../assets/icons/contacts.png" alt="join contacts"> Contacts</button></div>
        </div>
        <div class="aside-footer">
            <button>Privacy Policy</button>
            <button>Legal notice</button>
       
        </div>
    </section>
</body>
</html>
