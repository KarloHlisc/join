<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Contacts</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/help.css" />
    <link rel="stylesheet" href="../css/contact/contacts.css" />
    <link rel="stylesheet" href="../css/contact/contact_modal.css" />
    <link rel="stylesheet" href="../css/contact/contact_details.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/responsiveMobile.css" />
    <script src="../script.js" type="module"></script>
    <script src="../js/contacts.js" type="module"></script>
  </head>
  <body>
    <aside class="side-bar-wrapper">
      <div class="aside-logo">
        <img src="../assets/img/join_white.svg" alt="Logo" />
      </div>
      <div class="aside-menu">
        <button id="nav-summary" onclick="location.href = './summary.html'">
          <img src="../assets/icons/summary.png" alt="" /> Summary
        </button>
        <button id="nav-add_task" onclick="location.href = './add_task.html'">
          <img src="../assets/icons/add_task.png" alt="" /> Add Task
        </button>
        <button id="nav-board" onclick="location.href = './board.html'">
          <img src="../assets/icons/board.png" alt="" /> Board
        </button>
        <button id="nav-contacts" onclick="location.href = './contacts.html'">
          <img src="../assets/icons/contacts.png" alt="" /> Contacts
        </button>
      </div>
      <div id="mobile-footer" class="aside-footer">
        <button
          class="nav-policy-btn"
          onclick="location.href = './policy_after_login.html'"
        >
          Privacy Policy
        </button>
        <button
          class="nav-legal-btn"
          onclick="location.href = './legal_after_login.html'"
        >
          Legal notice
        </button>
      </div>
    </aside>
    <header>
      <p>Kanban Project Management Tool</p>
      <div class="user-and-help">
        <button class="help-btn help" onclick="location.href = './help.html'">
          <img src="../assets/icons/help.png" alt="help-icon" />
        </button>
        <div class="user-icon-wrapper">
          <button
            class="user-icon"
            id="header-icon"
            onclick="showLogoutModule()"
          ></button>
          <div id="logout-container"></div>
        </div>
      </div>
    </header>
    <main>
      <div id="main-container">
        <div id="list-container"></div>
        <div id="contact-details-container">
          <div id="details-header">
            <h1>Contacts</h1>
            <span>Better with a team</span>
          </div>
        </div>
      </div>
      <div id="add-contact-container"></div>
      <div id="help-container"></div>
    </main>
    <div id="congrats-modal" class="modal">
      <p>Contact successfully created.</p>
    </div>
    <div id="deleted-modal" class="modal">
      <p>Contact successfully deleted.</p>
    </div>
    <div id="edited-modal" class="modal">
      <p>Contact successfully edited.</p>
    </div>
  </body>
</html>
