<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <script src="script.js" type="module"></script>
    <script src="./js/config.js" type="module"></script>
    <title>Join</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <img
        class="header-logo"
        src="./assets/img/join_img_mid.png"
        alt="header_logo"
      />
      <div class="sign-up-container">
        <p>Not a Join user?</p>
        <button
          id="signup-button"
          onclick="location.href = './html/signup.html'"
        >
          Sign up
        </button>
      </div>
    </header>
    <main>
      <div class="form-container">
        <h1>Log in</h1>
        <form id="login-form">
          <input type="text" placeholder="Email" id="email" required />
          <div class="input-wrapper">
            <input
              type="password"
              placeholder="Password"
              id="password"
              required
            />
            <button
              type="button"
              style="display: none"
              class="toggle-password-btn"
              onclick="togglePasswordVisibility('password', 'eye-icon-pass')"
            >
              <img
                src="./assets/icons/visibility.png"
                alt="eye_icon"
                id="eye-icon-pass"
              />
            </button>
          </div>
          <div id="errorMessage" style="color: red"></div>
          <div class="button-container">
            <button type="submit" id="login-button">Log in</button>
            <button type="button" id="guest-button" onclick="logInAsGuest()">
              Guest Log in
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer>
      <a href="./html/policy_login.html">Privacy Policy</a>
      <a href="./html/legal_login.html">Legal notice</a>
    </footer>
  </body>
</html>
